name: Bug report
description: Something went wrong while importing or practicing.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Browser or Android version
      placeholder: Chrome on Windows, Firefox on Linux, Android 15…
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal vocabulary example or screenshot
      description: A few invented CSV rows help. Remove any private vocabulary or personal information.
